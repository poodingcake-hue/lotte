name: Deploy Vite App to GitHub Pages

on:
  # 기본 브랜치(main 또는 master)에 푸시될 때마다 실행됩니다.
  push:
    branches: [ main, master ]
  # 자동 업데이트 워크플로가 끝난 뒤에도 배포합니다.
  # github-actions[bot]이 GITHUB_TOKEN으로 만든 푸시는 위 push 이벤트를 트리거하지 않으므로
  # (Actions 무한 루프 방지 규칙) workflow_run으로 별도로 이어받아야 합니다.
  workflow_run:
    workflows: ["Update Lotte Schedule", "Update Weather Data"]
    types: [completed]
  # GitHub Actions 탭에서 수동으로 실행할 수 있게 합니다.
  workflow_dispatch:

# GitHub Pages 배포를 위해 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 여러 배포가 동시에 실행되지 않도록 설정
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # 업데이트 워크플로가 실패했을 때는 굳이 재배포하지 않습니다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        # 프론트엔드 폴더 내에서 npm 명령어들이 실행되도록 설정
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run으로 실행될 때는 봇이 방금 푸시한 커밋까지 포함하도록
          # 해당 브랜치의 최신 상태를 체크아웃합니다.
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 빌드 결과물이 저장되는 경로 (frontend/dist)
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
