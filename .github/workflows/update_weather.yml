name: Update Weather Data

on:
  # 구글 앱스 스크립트에서 보내는 신호(google_sheet_update)를 받습니다.
  repository_dispatch:
    types: [google_sheet_update]
    
  schedule:
    - cron: '0 * * * *' # 1시간마다 자동 백업/실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 푸시 전 rebase를 하려면 얕은 클론이 아니어야 합니다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Fetch Data
        run: |
          # 2. 기상청 날씨 데이터 업데이트 (weather.json)
          python update_weather.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add frontend/public/weather.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update weather via KMA API"

          # 편성표 워크플로와 푸시가 겹치면 non-fast-forward로 밀려나므로 rebase 후 재시도
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "Pushed"
              exit 0
            fi
            git rebase --abort || true
            echo "Push failed - retry ($i/3)"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
